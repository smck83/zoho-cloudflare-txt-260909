name: probe

# A second vantage point, and one nobody has to take on trust.
#
# Every measurement in the README is from a single location in Sydney, which is
# the first thing anyone reading a resolver bug report will want to discount.
# GitHub's runners sit in Azure datacentres a long way from there, and the logs
# of every run are public, so this is evidence that does not depend on my
# network or my server being believed.
#
# It is equally useful if it does NOT reproduce here. That localises the fault
# rather than weakening the report, which is why the job stays green either way
# and puts the finding in the summary instead of the exit code. A permanently
# red badge would say "this repo is broken", not "this resolver is".
#
# Sampling is spread across the run rather than fired in a burst. The behaviour
# being documented is intermittent, so twelve rounds an hour apart-ish says far
# more than one burst of the same number of queries. Doing it inside a single
# job also avoids the obvious alternative of having the workflow re-trigger
# itself: GITHUB_TOKEN cannot start another workflow run by design, so that
# needs a PAT, and one failed run then breaks the chain with nothing to restart
# it. A job can run for six hours; this uses one of them.

on:
  schedule:
    # Hourly. Each run then samples across ~55 minutes, so coverage is close to
    # continuous without depending on the scheduler being punctual, which it is
    # not: GitHub delays scheduled runs under load and sometimes drops them.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "Sampling rounds spread across the run"
        default: "12"
      gap:
        description: "Seconds between rounds"
        default: "270"
      samples:
        description: "Samples per resolver per domain, per round"
        default: "3"

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet dnspython

      - name: Where is this runner
        id: where
        run: |
          # The Cloudflare node that answers is the datum that matters, and
          # probe.py records it per resolver. The public address is here only
          # so a reader can see this is not the same network as the README's.
          IP=$(curl -fsS --max-time 10 https://api.ipify.org || echo unknown)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Runner public address: $IP"

      # The cause, not the symptom. Recorded first and once, because it is the
      # line that will change on the day Zoho fixes the nameservers, and having
      # it dated in results/ is how anyone will know when that was. Cheap: eight
      # nameservers, two protocols, one query each.
      - name: Check the nameservers
        id: edns
        run: |
          set +e
          python probe.py --edns zoho.com | tee /tmp/edns.txt
          echo "offenders=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Probe across the hour
        id: probe
        run: |
          ROUNDS="${{ github.event.inputs.rounds || '12' }}"
          GAP="${{ github.event.inputs.gap || '270' }}"
          SAMPLES="${{ github.event.inputs.samples || '3' }}"
          DISAGREED=0
          : > /tmp/probe.txt
          for i in $(seq 1 "$ROUNDS"); do
            echo "=== round $i/$ROUNDS  $(date -u +%H:%M:%SZ) ===" | tee -a /tmp/probe.txt
            set +e
            # Only the subject each round. The controls answer a question that
            # does not change minute to minute, so they run once at the end.
            python probe.py --samples "$SAMPLES" zoho.com | tee -a /tmp/probe.txt
            [ "${PIPESTATUS[0]}" = "1" ] && DISAGREED=1
            set -e
            [ "$i" -lt "$ROUNDS" ] && sleep "$GAP"
          done
          echo "=== controls  $(date -u +%H:%M:%SZ) ===" | tee -a /tmp/probe.txt
          set +e
          python probe.py --samples "$SAMPLES" wiz.io crowdstrike.com uber.com wework.com \
            | tee -a /tmp/probe.txt
          [ "${PIPESTATUS[0]}" = "1" ] && DISAGREED=1
          set -e
          echo "disagreed=$DISAGREED" >> "$GITHUB_OUTPUT"

      - name: Record
        run: |
          mkdir -p results
          STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
          {
            echo "# ${STAMP}"
            echo "# runner: github-actions ubuntu-latest, public address ${{ steps.where.outputs.ip }}"
            echo "# run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            cat /tmp/edns.txt
            echo
            cat /tmp/probe.txt
          } > "results/${STAMP}.txt"
          cp "results/${STAMP}.txt" results/latest.txt

      - name: Summary
        run: |
          {
            echo "### Probe from GitHub Actions"
            echo
            echo "Runner public address \`${{ steps.where.outputs.ip }}\`."
            echo
            if [ "${{ steps.edns.outputs.offenders }}" = "1" ]; then
              echo "**Nameservers still ignoring the advertised EDNS buffer.**"
            else
              echo "**All zoho.com nameservers respected the advertised buffer this run.**"
              echo "If that holds, the effect below should stop."
            fi
            echo
            echo '```'
            cat /tmp/edns.txt
            echo '```'
            echo
            if [ "${{ steps.probe.outputs.disagreed }}" = "1" ]; then
              echo "**Resolvers disagreed in at least one round.**"
            else
              echo "All resolvers agreed in every round of this run."
            fi
            echo
            echo '```'
            tail -c 60000 /tmp/probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "probe: $(date -u +%Y-%m-%dT%H:%M:%SZ) from GitHub Actions"
            # Another run may have landed while this one was probing.
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
